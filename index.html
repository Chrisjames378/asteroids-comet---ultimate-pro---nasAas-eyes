  <head>
    <script>
      (function() {
        const origErr = console.error;
        const origWarn = console.warn;
        const isWsError = (msg) => {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || msg.toString());
          return str.includes('[vite] failed to connect to websocket') ||
                 str.includes('WebSocket connection to') ||
                 str.includes('WebSocket') ||
                 str.includes('ws://');
        };
        console.error = function(...args) {
          if (isWsError(args[0])) return;
          origErr.apply(console, args);
        };
        console.warn = function(...args) {
          if (isWsError(args[0])) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
